<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECOND SOURCE</title>

    <link
        rel="preload"
        as="image"
        href="./images/drip_cover_front.jpg"
    >

    <link
        rel="stylesheet"
        href="./site.css?v=1"
    >

    <link
        rel="stylesheet"
        href="./experiment.css?v=13"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header experiment-header">

        <a
            class="site-logo"
            href="./index.html"
        >
            SECOND SOURCE
        </a>


        <div class="experiment-controls">

            <!-- =================================
                 SOUND
            ================================== -->

            <div class="compact-player">

                <button
                    id="play-button"
                    class="player-button"
                    type="button"
                    aria-label="Play"
                >
                    <span id="play-symbol">
                        ▶
                    </span>
                </button>


                <button
                    id="sound-button"
                    class="sound-button"
                    type="button"
                    aria-label="Mute"
                >
                    <span id="speaker-symbol">
                        ◖))
                    </span>
                </button>


                <input
                    id="volume-slider"
                    class="volume-slider"
                    type="range"
                    min="0"
                    max="100"
                    value="35"
                    step="0.1"
                    aria-label="Volume"
                >


                <span
                    id="volume-percent"
                    class="volume-percent"
                    title="Drag up or down"
                >
                    35%
                </span>

            </div>


            <a
                class="return-link"
                href="./index.html"
            >
                RETURN
            </a>

        </div>

    </header>


    <!-- =========================================
         ARTWORK
    ========================================== -->

    <main class="experiment-main">

        <div
            id="visual-container"
            class="visual-container"
        >

            <div
                id="visual-media"
                class="visual-media"
            >

                <img
                    id="fallback-image"
                    class="fallback-image"
                    src="./images/drip_cover_front.jpg"
                    alt="Artwork"
                    fetchpriority="high"
                    decoding="async"
                    draggable="false"
                >


                <canvas
                    id="visual"
                    class="visual-canvas"
                ></canvas>

            </div>


            <div
                id="interaction-message"
                class="interaction-message"
            >
                TOUCH / MOVE
            </div>

        </div>

    </main>


    <!-- =========================================
         HIDDEN PLAYER SUPPORT

         JS still uses these elements.
    ========================================== -->

    <div
        class="player-support"
        aria-hidden="true"
    >

        <div id="progress-track">
            <div id="progress-fill"></div>
        </div>

        <span id="player-time">
            0:00 / 0:00
        </span>

    </div>


    <!-- =========================================
         AUDIO
    ========================================== -->

    <audio
        id="experiment-audio"
        loop
        preload="auto"
    >

        <source
            src="./audio/sage-counsel.wav"
            type="audio/wav"
        >

        <source
            src="./audio/3. Sage Counsel (24B_48KHz_MST)_timeitemstudio DIGI.wav"
            type="audio/wav"
        >

    </audio>


    <script src="./experiment.js?v=14"></script>

</body>

</html>
