<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECOND SOURCE — SRC001</title>

    <link
        rel="stylesheet"
        href="./experiment.css?v=5"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="experiment-header">

        <a
            class="second-source"
            href="./index.html"
        >
            SECOND SOURCE
        </a>


        <a
            class="return-link"
            href="./index.html"
        >
            RETURN
        </a>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="experiment-main">


        <!-- =====================================
             RELEASE INFORMATION
        ====================================== -->

        <section class="experiment-information">

            <p class="catalogue">
                SRC001
            </p>

            <h1>
                MARTIN SOLLI
            </h1>

            <h2>
                DRIP
            </h2>

            <p class="experiment-type">
                INTERACTIVE ARTWORK
            </p>

        </section>


        <!-- =====================================
             INTERACTIVE ARTWORK
        ====================================== -->

        <section class="artwork-section">

            <div
                id="visual-container"
                class="visual-container"
            >

                <img
                    id="fallback-image"
                    class="fallback-image"
                    src="./images/drip_cover_front.jpg"
                    alt="Martin Solli — Drip"
                >


                <canvas
                    id="visual"
                    class="visual-canvas"
                ></canvas>


                <div
                    id="interaction-message"
                    class="interaction-message"
                >
                    MOVE / TOUCH
                </div>


                <!-- SOUND -->

                <button
                    id="sound-button"
                    class="sound-button"
                    type="button"
                    aria-label="Sound"
                    title="Sound"
                >

                    <svg
                        class="sound-icon"
                        viewBox="0 0 32 32"
                        aria-hidden="true"
                    >

                        <path
                            class="speaker-shape"
                            d="M5 12H10L16 7V25L10 20H5Z"
                        ></path>

                        <path
                            class="sound-wave sound-wave-one"
                            d="M20 12C22 14 22 18 20 20"
                        ></path>

                        <path
                            class="sound-wave sound-wave-two"
                            d="M24 9C28 13 28 19 24 23"
                        ></path>

                        <path
                            class="mute-line"
                            d="M21 11L28 21"
                        ></path>

                        <path
                            class="mute-line"
                            d="M28 11L21 21"
                        ></path>

                    </svg>

                </button>

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="experiment-footer">

        <span>
            SECOND SOURCE / 2026
        </span>

        <span>
            SRC001
        </span>

    </footer>


    <!-- =========================================
         AUDIO
    ========================================== -->

    <audio
        id="experiment-audio"
        autoplay
        loop
        preload="auto"
    >

        <source
            src="./audio/3. Sage Counsel (24B_48KHz_MST)_timeitemstudio DIGI.wav"
            type="audio/wav"
        >

    </audio>


    <script src="./experiment.js?v=6"></script>

</body>

</html>
