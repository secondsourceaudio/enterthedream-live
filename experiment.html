<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECOND SOURCE — SRC001</title>

    <link
        rel="stylesheet"
        href="./experiment.css?v=8"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="experiment-header">

        <a
            class="second-source"
            href="./index.html"
        >
            SECOND SOURCE
        </a>


        <div class="header-right">

            <!-- =================================
                 MINI PLAYER
            ================================== -->

            <div
                id="mini-player"
                class="mini-player"
            >

                <button
                    id="play-button"
                    class="play-button"
                    type="button"
                    aria-label="Play"
                >

                    <svg
                        id="play-icon"
                        class="player-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M8 5L19 12L8 19Z"></path>
                    </svg>


                    <svg
                        id="pause-icon"
                        class="player-icon is-hidden"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M8 5V19"></path>
                        <path d="M16 5V19"></path>
                    </svg>

                </button>


                <div class="player-information">

                    <div class="player-topline">

                        <span class="player-track">
                            SAGE COUNSEL
                        </span>

                        <span
                            id="player-time"
                            class="player-time"
                        >
                            0:00 / 0:00
                        </span>

                    </div>


                    <div
                        id="progress-track"
                        class="progress-track"
                    >

                        <div
                            id="progress-fill"
                            class="progress-fill"
                        ></div>

                    </div>

                </div>


                <!-- VOLUME -->

                <div
                    id="volume-control"
                    class="volume-control"
                    title="Drag up/down to change volume"
                >

                    <button
                        id="sound-button"
                        class="sound-button"
                        type="button"
                        aria-label="Mute"
                    >

                        <svg
                            class="sound-icon"
                            viewBox="0 0 32 32"
                            aria-hidden="true"
                        >

                            <path
                                d="M5 12H10L16 7V25L10 20H5Z"
                            ></path>

                            <path
                                class="sound-wave"
                                d="M20 12C22 14 22 18 20 20"
                            ></path>

                            <path
                                class="sound-wave"
                                d="M24 9C28 13 28 19 24 23"
                            ></path>

                            <path
                                class="mute-line"
                                d="M21 11L28 21"
                            ></path>

                            <path
                                class="mute-line"
                                d="M28 11L21 21"
                            ></path>

                        </svg>

                    </button>


                    <span
                        id="volume-percent"
                        class="volume-percent"
                    >
                        35%
                    </span>

                </div>

            </div>


            <a
                class="return-link"
                href="./index.html"
            >
                RETURN
            </a>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="experiment-main">


        <div class="experiment-meta">

            <p>
                SRC001
            </p>

            <h1>
                MARTIN SOLLI — DRIP
            </h1>

        </div>


        <!-- =====================================
             INTERACTIVE ARTWORK
        ====================================== -->

        <div
            id="visual-container"
            class="visual-container"
        >

            <img
                id="fallback-image"
                class="fallback-image"
                src="./images/drip_cover_front.jpg"
                alt="Martin Solli — Drip"
            >


            <canvas
                id="visual"
                class="visual-canvas"
            ></canvas>


            <div
                id="interaction-message"
                class="interaction-message"
            >
                MOVE / TOUCH
            </div>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="experiment-footer">

        <span>
            SECOND SOURCE
        </span>

        <span>
            SRC001 / MARTIN SOLLI / DRIP
        </span>

        <span>
            2026
        </span>

    </footer>


    <!-- =========================================
         AUDIO

         Both filenames are included so this works
         whether or not you renamed the WAV.
    ========================================== -->

    <audio
        id="experiment-audio"
        autoplay
        loop
        preload="auto"
    >

        <source
            src="./audio/sage-counsel.wav"
            type="audio/wav"
        >

        <source
            src="./audio/3. Sage Counsel (24B_48KHz_MST)_timeitemstudio DIGI.wav"
            type="audio/wav"
        >

    </audio>


    <script src="./experiment.js?v=9"></script>

</body>

</html>
