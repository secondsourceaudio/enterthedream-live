<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECOND SOURCE — DRIP</title>

    <link
        rel="preload"
        as="image"
        href="./images/drip_cover_front.jpg"
    >

    <link
        rel="stylesheet"
        href="./site.css?v=1"
    >

    <link
        rel="stylesheet"
        href="./experiment.css?v=12"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <a
            class="site-logo"
            href="./index.html"
        >
            SECOND SOURCE
        </a>


        <nav class="site-nav">

            <a href="./gallery.html">
                CONCEPT ARCHIVE
            </a>

            <a
                href="https://secondsource.bandcamp.com"
                target="_blank"
                rel="noopener noreferrer"
            >
                BANDCAMP ↗
            </a>

            <a href="./index.html">
                RETURN
            </a>

        </nav>

    </header>


    <!-- =========================================
         MINI PLAYER
    ========================================== -->

    <section class="player-strip">

        <div class="mini-player">

            <button
                id="play-button"
                class="player-button"
                type="button"
                aria-label="Play"
            >
                <span id="play-symbol">
                    ▶
                </span>
            </button>


            <div class="player-main">

                <div class="player-information">

                    <span class="player-track">
                        SAGE COUNSEL
                    </span>

                    <span
                        id="player-time"
                        class="player-time"
                    >
                        0:00 / 0:00
                    </span>

                </div>


                <div
                    id="progress-track"
                    class="progress-track"
                >

                    <div
                        id="progress-fill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>


            <button
                id="sound-button"
                class="sound-button"
                type="button"
                aria-label="Mute"
            >

                <span id="speaker-symbol">
                    ◖))
                </span>

            </button>


            <div class="volume-control">

                <input
                    id="volume-slider"
                    class="volume-slider"
                    type="range"
                    min="0"
                    max="100"
                    value="35"
                    step="0.1"
                    aria-label="Volume"
                >


                <span
                    id="volume-percent"
                    class="volume-percent"
                    title="Drag up or down"
                >
                    35%
                </span>

            </div>

        </div>

    </section>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="experiment-main">

        <section class="experiment-heading">

            <p class="experiment-label">
                SRC001 / INTERACTIVE ARTWORK
            </p>

            <h1>
                DRIP
            </h1>

            <h2>
                MARTIN SOLLI
            </h2>

        </section>


        <section class="experiment-artwork">

            <div
                id="visual-container"
                class="visual-container"
            >

                <div
                    id="visual-media"
                    class="visual-media"
                >

                    <img
                        id="fallback-image"
                        class="fallback-image"
                        src="./images/drip_cover_front.jpg"
                        alt="Martin Solli — Drip"
                        fetchpriority="high"
                        decoding="async"
                        draggable="false"
                    >


                    <canvas
                        id="visual"
                        class="visual-canvas"
                    ></canvas>

                </div>


                <div
                    id="interaction-message"
                    class="interaction-message"
                >
                    MOVE / TOUCH / PINCH
                </div>

            </div>

        </section>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="experiment-footer">

        <span>
            SECOND SOURCE
        </span>

        <span>
            SRC001 / MARTIN SOLLI / DRIP
        </span>

        <span>
            2026
        </span>

    </footer>


    <!-- =========================================
         AUDIO
    ========================================== -->

    <audio
        id="experiment-audio"
        loop
        preload="auto"
    >

        <source
            src="./audio/sage-counsel.wav"
            type="audio/wav"
        >

        <source
            src="./audio/3. Sage Counsel (24B_48KHz_MST)_timeitemstudio DIGI.wav"
            type="audio/wav"
        >

    </audio>


    <script src="./experiment.js?v=14"></script>

</body>

</html>
