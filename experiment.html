<!DOCTYPE html>
<html lang="en">

<head>

    <title>SECOND SOURCE — SRC001 STUDY</title>

    <link

        href="./experiment.css?v=2"

</head>


<body>

    <header class="experiment-header">

        <div class="experiment-identity">

            <a
                class="second-source"
                href="./index.html"
            >

            </a>

            ></canvas>


            <img
                id="fallback-image"

        <div>
            MARTIN SOLLI — DRIP

        <div>
            LIQUID STUDY 001
        </div>

    </footer>


    <!-- =========================================
         AUDIO
    ========================================== -->

    <audio
        id="experiment-audio"
        loop
        preload="metadata"
    >
        <source
            src="./audio/3. Sage Counsel (24B_48KHz_MST)_timeitemstudio DIGI.wav"
            type="audio/wav"
        >
    </audio>
