<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECOND SOURCE — SRC001 STUDY</title>

    <link
        rel="stylesheet"
        href="./experiment.css?v=4"
    >

</head>


<body>

    <header class="experiment-header">

        <div class="experiment-identity">

            <a
                class="second-source"
                href="./index.html"
            >
                SECOND SOURCE
            </a>

            <span class="catalogue">
                SRC001
            </span>

        </div>


        <a
            class="return-link"
            href="./index.html"
        >
            RETURN
        </a>

    </header>


    <main class="experiment-main">

        <div
            id="visual-container"
            class="visual-container"
        >

            <img
                id="fallback-image"
                class="fallback-image"
                src="./images/drip_cover_front.jpg"
                alt="Martin Solli — Drip"
            >


            <canvas
                id="visual"
                class="visual-canvas"
            ></canvas>


            <div
                id="interaction-message"
                class="interaction-message"
            >
                MOVE / TOUCH
            </div>


            <button
                id="sound-button"
                class="sound-button"
                type="button"
                aria-label="Sound"
                title="Sound"
            >

                <svg
                    class="sound-icon"
                    viewBox="0 0 32 32"
                    aria-hidden="true"
                >

                    <path
                        class="speaker-shape"
                        d="M5 12H10L16 7V25L10 20H5Z"
                    ></path>

                    <path
                        class="sound-wave sound-wave-one"
                        d="M20 12C22 14 22 18 20 20"
                    ></path>

                    <path
                        class="sound-wave sound-wave-two"
                        d="M24 9C28 13 28 19 24 23"
                    ></path>

                    <path
                        class="mute-line"
                        d="M21 11L28 21"
                    ></path>

                    <path
                        class="mute-line"
                        d="M28 11L21 21"
                    ></path>

                </svg>

            </button>

        </div>

    </main>


    <footer class="experiment-footer">

        <div>
            MARTIN SOLLI — DRIP
        </div>

        <div>
            LIQUID STUDY 001
        </div>

    </footer>


    <audio
        id="experiment-audio"
        autoplay
        loop
        preload="auto"
    >

        <source
            src="./audio/3. Sage Counsel (24B_48KHz_MST)_timeitemstudio DIGI.wav"
            type="audio/wav"
        >

    </audio>


    <script src="./experiment.js?v=6"></script>

</body>

</html>
