<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECOND SOURCE — SRC001</title>

    <link
        rel="stylesheet"
        href="./experiment.css?v=7"
    >

</head>


<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="experiment-header">

        <a
            class="second-source"
            href="./index.html"
        >
            SECOND SOURCE
        </a>


        <div class="experiment-actions">

            <button
                id="sound-button"
                class="sound-button is-muted"
                type="button"
                aria-label="Play sound"
                title="Play sound"
            >

                <svg
                    class="sound-icon"
                    viewBox="0 0 32 32"
                    aria-hidden="true"
                >

                    <path
                        d="M5 12H10L16 7V25L10 20H5Z"
                    ></path>

                    <path
                        class="sound-wave"
                        d="M20 12C22 14 22 18 20 20"
                    ></path>

                    <path
                        class="sound-wave"
                        d="M24 9C28 13 28 19 24 23"
                    ></path>

                    <path
                        class="mute-line"
                        d="M21 11L28 21"
                    ></path>

                    <path
                        class="mute-line"
                        d="M28 11L21 21"
                    ></path>

                </svg>

            </button>


            <a
                class="return-link"
                href="./index.html"
            >
                RETURN
            </a>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="experiment-main">

        <div class="experiment-meta">

            <p>
                SRC001
            </p>

            <h1>
                MARTIN SOLLI — DRIP
            </h1>

        </div>


        <div
            id="visual-container"
            class="visual-container"
        >

            <img
                id="fallback-image"
                class="fallback-image"
                src="./images/drip_cover_front.jpg"
                alt="Martin Solli — Drip"
            >


            <canvas
                id="visual"
                class="visual-canvas"
            ></canvas>


            <div
                id="interaction-message"
                class="interaction-message"
            >
                MOVE / TOUCH
            </div>

        </div>

    </main>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="experiment-footer">

        SRC001 / MARTIN SOLLI / DRIP

    </footer>


    <!-- =========================================
         AUDIO
    ========================================== -->

    <audio
        id="experiment-audio"
        autoplay
        loop
        preload="auto"
    >
        <source
            src="./audio/sage-counsel.wav"
            type="audio/wav"
        >
    </audio>


    <script src="./experiment.js?v=8"></script>

</body>

</html>
