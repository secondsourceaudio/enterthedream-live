<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SECOND SOURCE</title>

    <link
        rel="stylesheet"
        href="./new.css?v=1"
    >
</head>


<body>

    <header class="site-header">

        <a
            class="logo"
            href="./new.html"
        >
            SECOND SOURCE
        </a>

    </header>


    <main class="main-content">

        <section class="release">

            <p class="release-label">
                SECOND SOURCE AUDIO
            </p>

            <h1>
                MARTIN SOLLI
            </h1>

            <h2>
                SAGE COUNSEL
            </h2>

            <p class="catalogue">
                SS001
            </p>


            <div class="player">

                <button
                    id="play-button"
                    class="play-button"
                    type="button"
                >
                    PLAY
                </button>

                <div class="track-info">

                    <span class="track-number">
                        01
                    </span>

                    <span class="track-name">
                        SAGE COUNSEL
                    </span>

                </div>

            </div>


            <audio
                id="audio"
                src="./audio/3. Sage Counsel (24B_48KHz_MST)_timeitemstudio DIGI.wav"
            ></audio>


            <div class="release-links">

                <a
                    href="https://secondsource.bandcamp.com"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    BANDCAMP
                </a>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <span>
            SECOND SOURCE
        </span>

        <a href="./dream.html">
            THE DREAM
        </a>

    </footer>


    <script>
        const audio =
            document.getElementById("audio");

        const playButton =
            document.getElementById("play-button");


        playButton.addEventListener(
            "click",
            function () {

                if (audio.paused) {

                    audio.play();

                    playButton.textContent =
                        "PAUSE";

                } else {

                    audio.pause();

                    playButton.textContent =
                        "PLAY";

                }

            }
        );


        audio.addEventListener(
            "ended",
            function () {

                playButton.textContent =
                    "PLAY";

            }
        );
    </script>

</body>

</html>
