name: Verify SRC001 release catalogue
on:
  push:
    branches: [verify/src001-release-catalogue]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Run focused desktop and mobile checks
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/src001-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8000/ -o /dev/null
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM_PATH
          python tests/browser_smoke.py -v \
            WebsiteTests.test_releases_navigation_shows_release_information \
            WebsiteTests.test_home_mobile_shows_campaign_without_opening_player_controls \
            WebsiteTests.test_home_current_release_on_desktop_and_mobile \
            WebsiteTests.test_background_audio_and_media_session_use_the_native_player \
            WebsiteTests.test_home_native_audio_without_capture_stream \
            WebsiteTests.test_continuous_player_keeps_one_audio_session_and_respects_pause_and_close
