name: Capture Instagram square
on:
  push:
    branches: [verify/inner-passage-preview]
jobs:
  capture:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          from io import BytesIO
          with sync_playwright() as p:
              b=p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=b.new_page(viewport=dict(width=1920,height=1280),device_scale_factor=1)
              page.goto('https://www.enterthedream.org/',wait_until='networkidle')
              page.evaluate("""async()=>{document.querySelectorAll('img[loading=lazy]').forEach(i=>i.loading='eager');await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));}""")
              stage=page.locator('.listening-space').bounding_box()
              crop=dict(x=round(stage['x']+(stage['width']-1080)/2),y=round(stage['y']+(stage['height']-1080)/2),width=1080,height=1080)
              assert stage['height']>=1080 and stage['width']>=1080
              for name,x,y in [('player',52,260),('directory',588,58),('message',540,822)]:
                  win=page.locator('.home-'+name+'-window')
                  before=win.bounding_box()
                  win.evaluate("""(e,p)=>{Object.assign(e.style,{left:p[0]+'px',top:p[1]+'px',right:'auto',bottom:'auto'})}""",[crop['x']-stage['x']+x,crop['y']-stage['y']+y])
                  after=win.bounding_box()
                  assert before['width']==after['width'] and before['height']==after['height']
                  assert after['x']>=crop['x'] and after['x']+after['width']<=crop['x']+1080 and after['y']+after['height']<=crop['y']+1080
              page.locator('[data-sound]').click()
              page.evaluate("document.querySelector('audio').currentTime=62")
              page.mouse.move(0,0)
              page.wait_for_function("document.querySelector('audio').currentTime>62.5 && [...document.querySelectorAll('.spectrum-band')].filter(e=>+e.style.getPropertyValue('--level')>.15).length>=7")
              assert page.evaluate('devicePixelRatio')==1
              page.screenshot(path='SRC-OS-Desktop-Crop.png',clip=crop,scale='device',timeout=100000)
              assert Image.open('SRC-OS-Desktop-Crop.png').size==(1080,1080)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-crop
          path: SRC-OS-Desktop-Crop.png
