name: Capture native desktop PNG
on:
  push:
    branches: [verify/inner-passage-preview]
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium webkit
      - name: Check preview playback in Chromium and mobile WebKit
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused http://127.0.0.1:8000/ -o /dev/null
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          export CHROMIUM_PATH
          python tests/browser_smoke.py \
            WebsiteTests.test_home_exclusive_preview_on_desktop_and_mobile \
            WebsiteTests.test_background_audio_and_media_session_use_the_native_player \
            WebsiteTests.test_home_mobile_shows_campaign_without_opening_player_controls
          SITE_TEST_BROWSER=mobile-webkit python tests/browser_smoke.py \
            WebsiteTests.test_home_native_audio_without_capture_stream
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import struct
          with sync_playwright() as p:
              b=p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=b.new_page(viewport={'width':1080,'height':1080},device_scale_factor=2)
              page.goto('https://www.enterthedream.org/',wait_until='domcontentloaded')
              page.evaluate("""()=>{let rules=[...document.styleSheets].flatMap(s=>[...s.cssRules]);let tablet=rules.find(r=>r.conditionText==='(max-width: 1360px)' && r.cssText.includes('.src-os-clock'));if(!tablet)throw Error('missing desktop breakpoint');tablet.media.mediaText='not all';}""")
              page.add_style_tag(content="""
                body.home-desktop.src-os {height:100dvh;min-height:0;margin:0;padding:0;display:flex;flex-direction:column}
                body.home-desktop.src-os :is(.site-header,.landing-experiment,.legal-footer) {width:100%;max-width:none;margin:0;box-sizing:border-box}
                body.home-desktop .landing-experiment {flex:1 1 0;min-height:0;height:auto}
                .home-player-window {left:5%;top:24%;width:570px}
                .home-directory-window {left:auto;right:5%;top:6%;width:420px}
                .home-message-window {left:auto;right:6%;top:auto;bottom:9%;width:450px}
              """)
              page.evaluate("""async()=>{document.querySelectorAll('img[loading=lazy]').forEach(i=>i.loading='eager');await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));}""")
              logo,nav,clock=[page.locator(s).bounding_box() for s in ('.site-logo','.site-nav','.src-os-clock')]
              if logo['x']+logo['width']+12>nav['x']:
                  page.locator('.site-nav').evaluate("(e,x)=>{e.style.left=x+'px';e.style.transform='none'}",logo['x']+logo['width']+12)
                  nav=page.locator('.site-nav').bounding_box()
              assert clock and nav['x']+nav['width']<clock['x'] and abs(nav['y']+nav['height']/2-logo['y']-logo['height']/2)<4
              assert page.evaluate('[innerWidth,innerHeight,devicePixelRatio]')==[1080,1080,2]
              page.locator('[data-sound]').click()
              page.evaluate("document.querySelector('audio').currentTime=62")
              page.mouse.move(0,1079)
              page.wait_for_function("document.querySelector('audio').currentTime>62.5 && [...document.querySelectorAll('.spectrum-band')].filter(e=>+e.style.getPropertyValue('--level')>.15).length>=7")
              raw=page.screenshot(path='SRC-OS-Desktop-2160.png',type='png',scale='device',timeout=100000)
              assert struct.unpack('>II',raw[16:24])==(2160,2160)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-2160
          path: SRC-OS-Desktop-2160.png
