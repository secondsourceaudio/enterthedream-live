name: Verify iPhone spectrum
on:
  push:
    branches: [verify/inner-passage-preview]
jobs:
  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps webkit
      - run: |
          python -m http.server 8000 >/tmp/site.log 2>&1 &
          cd tests
          python - <<'PY'
          import unittest
          from browser_smoke import WebsiteTests, sync_playwright
          class MobileWebKit(WebsiteTests):
              @classmethod
              def setUpClass(cls):
                  cls.playwright = sync_playwright().start()
                  cls.browser = cls.playwright.webkit.launch()
              def setUp(self):
                  self.errors = []
                  self.context = self.browser.new_context(**self.playwright.devices['iPhone 13'])
                  self.page = self.context.new_page()
                  self.page.on('pageerror', lambda error: self.errors.append(str(error)))
          unittest.main(defaultTest='MobileWebKit.test_home_native_audio_without_capture_stream', verbosity=2)
          PY
