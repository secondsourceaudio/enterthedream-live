name: Capture square homepage
on: [push]
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: |
          cat >/tmp/serve.go <<'GO'
          package main
          import "net/http"
          func main(){ panic(http.ListenAndServe("127.0.0.1:8099",http.FileServer(http.Dir(".")))) }
          GO
          go build -o /tmp/slide-server /tmp/serve.go
          /tmp/slide-server &
          python - <<'PY'
          from playwright.sync_api import sync_playwright, expect
          from PIL import Image
          import re
          with sync_playwright() as p:
              browser=p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=browser.new_page(viewport={'width':2160,'height':2160},device_scale_factor=1)
              page.goto('http://127.0.0.1:8099/')
              page.evaluate('document.fonts.ready')
              nav=page.get_by_role('navigation',name='Main navigation')
              link=nav.get_by_role('link',name='ABOUT / CONTACT',exact=True)
              expect(link).to_have_attribute('href','/about/')
              expect(link).to_have_text('?',use_inner_text=True)
              expect(nav.locator('a:visible')).to_have_text(['RELEASES','SOURCES','MERCH','?','BANDCAMP'],use_inner_text=True)
              expect(page.locator('#visual')).to_have_class(re.compile('is-ready'))
              expect(page.locator('[data-duration]')).to_have_text('6:13')
              boxes=page.locator('.site-header, [data-home-window], .legal-footer')
              assert boxes.count()==5
              for el in boxes.all():
                  expect(el).to_be_visible()
                  b=el.bounding_box()
                  assert 0<=b['x'] and b['x']+b['width']<=2160 and 0<=b['y'] and b['y']+b['height']<=2160,b
              page.screenshot(path='/tmp/home.png')
              with Image.open('/tmp/home.png') as im:
                  assert im.size==(2160,2160)
                  im.resize((1080,1080),Image.Resampling.LANCZOS).save('Second-Source-Slide-2.png')
              link.click()
              expect(page).to_have_url('http://127.0.0.1:8099/about/', timeout=30000)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-slide-2
          path: Second-Source-Slide-2.png
