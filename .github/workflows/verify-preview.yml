name: Capture Instagram square
on:
  push:
    branches: [verify/inner-passage-preview]
jobs:
  capture:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from PIL import Image
          from io import BytesIO
          with sync_playwright() as p:
              b=p.chromium.launch(args=['--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=b.new_page(viewport=dict(width=1080,height=1080),device_scale_factor=2)
              page.goto('https://www.enterthedream.org/',wait_until='networkidle')
              page.add_style_tag(content="""
                  body.home-desktop.src-os {display:flex!important;flex-direction:column!important;width:100vw!important;height:100vh!important;min-height:0!important;margin:0!important;padding:0!important}
                  body.home-desktop .site-header,body.home-desktop .landing-experiment,body.home-desktop .legal-footer {width:100%!important;max-width:none!important;margin:0!important;box-sizing:border-box!important}
                  body.home-desktop .landing-experiment {flex:1 1 0!important;min-height:0!important;height:auto!important}
                  body.home-desktop .site-header,body.home-desktop .legal-footer {flex:none!important}
                  .home-player-window {left:5%!important;top:23%!important;width:570px!important}
                  .home-directory-window {right:5%!important;left:auto!important;top:5%!important;width:360px!important}
                  .home-message-window {right:6%!important;left:auto!important;bottom:9%!important;top:auto!important;width:390px!important}
              """)
              print('layout ready',flush=True)
              page.evaluate("async()=>{document.querySelectorAll('img[loading=lazy]').forEach(i=>i.loading='eager'); await document.fonts.ready; await Promise.all([...document.images].map(i=>i.decode()));}")
              print('images and fonts ready',flush=True)
              page.locator('[data-sound]').click()
              page.evaluate("document.querySelector('audio').currentTime=62")
              page.mouse.move(0,1079)
              page.wait_for_function("document.querySelector('audio').currentTime>62.5 && [...document.querySelectorAll('.spectrum-band')].filter(e=>+e.style.getPropertyValue('--level')>.15).length>=7")
              page.wait_for_load_state('networkidle')
              geo=page.locator('.site-header,.home-window,.legal-footer').evaluate_all("els=>els.map(e=>[e.className,...['x','y','width','height'].map(k=>e.getBoundingClientRect()[k])])")
              print(geo,flush=True)
              assert len(geo)==5 and all(x>=-1 and y>=-1 and x+w<=1081 and y+h<=1081 for _,x,y,w,h in geo)
              assert geo[0][1:3]==[0,0] and geo[-1][2]+geo[-1][4]==1080
              shot=Image.open(BytesIO(page.screenshot(type='png',scale='device')))
              assert shot.size==(2160,2160)
              shot.resize((1080,1080),Image.Resampling.BOX).save('SRC-OS-Instagram.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: src-square
          path: SRC-OS-Instagram.png
