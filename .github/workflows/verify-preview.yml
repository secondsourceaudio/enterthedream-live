name: Verify continuous playback
on: [push]
permissions:
  contents: read
jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv /tmp/pw
          /tmp/pw/bin/pip install playwright pillow
          /tmp/pw/bin/python -m playwright install --with-deps webkit
      - run: |
          python3 -m http.server 8099 --bind 127.0.0.1 &
          /tmp/pw/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright, expect
          from PIL import Image
          from io import BytesIO
          with sync_playwright() as p:
              browser=p.webkit.launch()
              page=browser.new_page(**p.devices['iPhone 13'])
              page.goto('http://127.0.0.1:8099/index.html?utm_source=instagram&fbclid=test')
              canvas=page.locator('#visual')
              expect(canvas).to_have_class(__import__('re').compile('is-ready'),timeout=20000)
              shot=Image.open(BytesIO(page.locator('#visual-container').screenshot())).convert('RGB')
              assert max(shot.crop((0,0,shot.width,shot.height//8)).convert('L').getextrema()) > 10
              audio=page.locator('audio')
              assert audio.count()==1 and audio.evaluate('a=>a.paused && !a.autoplay')
              page.locator('[data-sound]').tap()
              page.wait_for_function("document.querySelector('audio').currentTime > .5")
              art=page.evaluate("navigator.mediaSession.metadata.artwork[0]")
              assert art['sizes']=='512x512' and art['type']=='image/jpeg'
              assert art['src']=='http://127.0.0.1:8099/images/share/inner-passage-512.jpg'
              image=Image.open(BytesIO(page.request.get(art['src']).body()))
              assert image.format=='JPEG' and image.size==(512,512)
              page.evaluate("window.track = document.querySelector('audio'); window.pauses = 0; track.onpause = () => pauses++; window.meta = navigator.mediaSession.metadata")
              docs=[]
              page.on('request', lambda r: docs.append(r.url) if r.is_navigation_request() else None)
              link=page.get_by_role('navigation',name='Main navigation').get_by_role('link',name='RELEASES',exact=True)
              link.evaluate("a => a.setAttribute('href','/releases?fbclid=test')")
              link.tap()
              page.wait_for_url('**/releases/?fbclid=test')
              assert not docs, docs
              expect(page.locator('[data-corner-player]')).to_be_visible()
              expect(page.locator('.release-cover')).to_have_attribute('src','/images/src001/inner_front.webp')
              for tag in ['meta[property="og:image"]','meta[name="twitter:image"]']:
                  assert page.locator(tag).get_attribute('content').endswith('/inner_front.webp')
              page.go_back()
              expect(canvas).to_be_visible()
              page.go_forward()
              expect(page.locator('[data-corner-player]')).to_be_visible()
              page.locator('.site-logo').tap()
              expect(canvas).to_be_visible()
              assert page.evaluate("track === document.querySelector('audio') && !track.paused && !pauses && navigator.mediaSession.metadata === meta")
              page.locator('.site-nav a[href="/sources/"]').tap()
              page.wait_for_url('**/sources/')
              assert page.locator('[data-corner-player]').count() == 0
              assert page.locator('audio').evaluate('a=>a.paused && !a.currentSrc')
              browser.close()
          PY
