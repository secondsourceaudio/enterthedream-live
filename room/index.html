<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Music and quietly looping scenes. A Second Source listening-room preview.">
    <link rel="icon" href="/favicon.ico?v=1" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
    <title>Listening Room — Second Source / Preview</title>
    <link rel="stylesheet" href="/site.css?v=13">
    <link rel="stylesheet" href="/room.css?v=2">
    <script src="/site.js?v=5" defer></script>
    <script src="/room-scenes.js?v=1" defer></script>
    <script src="/room.js?v=2" defer></script>
    <link rel="canonical" href="https://www.enterthedream.org/room/">
</head>
<body class="room-page">
    <a class="skip-link" href="#main-content">SKIP TO CONTENT</a>
    <header class="site-header">
        <a class="site-logo" href="/">SECOND SOURCE</a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/releases/">RELEASES</a>
            <a href="/merch/">MERCH</a>
            <a href="/about/">ABOUT / CONTACT</a>
            <a href="https://secondsource.bandcamp.com" target="_blank" rel="noopener noreferrer">BANDCAMP <svg class="external-arrow" width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 10 10 2M2 2h8v8" fill="none" stroke="currentColor" stroke-width="1"/></svg></a>
        </nav>
    </header>
    <main id="main-content" tabindex="-1" class="room-main">
        <header class="room-heading">
            <h1>LISTENING ROOM</h1>
            <p>PREVIEW</p>
        </header>
        <section class="room" data-room data-scene="shore" aria-label="Music and scenery">
            <div class="room-scenes" role="group" aria-label="Choose scenery">
                <span>SCENE</span>
                <button type="button" data-room-scene="shore" aria-pressed="true">DAY / SHORE</button>
                <button type="button" data-room-scene="city" aria-pressed="false">NIGHT / CITY</button>
            </div>
            <div class="room-frame" tabindex="0" role="group" aria-label="A misty low-poly shore with gentle waves, trees and a stone arch. Slowly looping scenery. Press Space to play or pause music, F for fullscreen.">
                <svg class="room-fallback" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                    <defs><linearGradient id="room-sky" x2="0" y2="1"><stop stop-color="#4e647a"/><stop offset="1" stop-color="#bdc0bd"/></linearGradient><linearGradient id="room-water" x2="0" y2="1"><stop stop-color="#9aaeb5"/><stop offset="1" stop-color="#395e63"/></linearGradient></defs>
                    <path fill="url(#room-sky)" d="M0 0h1600v1000H0z"/>
                    <path fill="#85979c" d="m0 520 190-120 130 100 160-90 170 105 140-70 170 80 160-130 150 100 150-90 180 120v500H0z"/>
                    <path fill="url(#room-water)" d="M0 540h1600v460H0z"/>
                    <path fill="#526b65" d="m430 610 210-65 230 5 190 62-265 25z"/>
                    <path fill="none" stroke="#b6b6a8" stroke-width="25" d="M715 565v-65a70 70 0 0 1 140 0v65"/>
                    <path fill="#3b554d" d="M0 670 175 620 285 685 390 810 315 1000H0z"/>
                </svg>
                <svg class="room-fallback room-fallback-city" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                    <defs><linearGradient id="room-night" x2="0" y2="1"><stop stop-color="#11162f"/><stop offset="1" stop-color="#48404b"/></linearGradient></defs>
                    <path fill="url(#room-night)" d="M0 0h1600v1000H0z"/>
                    <path fill="#171b29" d="M0 100h270v85h170v180h180v270H0zm1600-40h-300v200h-190v160H980v215h620z"/>
                    <path fill="#27242c" d="M0 590h1600v410H0z"/><path fill="#161924" d="m0 1000 710-410h180l710 410z"/>
                    <path fill="#aa7947" d="M100 310h70v90h-70zm0 175h70v100h-70zm220-100h48v70h-48zm900 40h55v90h-55zm200-150h75v105h-75zm0 210h75v95h-75z"/>
                    <path stroke="#c19a64" stroke-width="6" d="M460 780V440m680 345V450"/><path fill="#d2ab72" d="M443 434h34v40h-34zm680 10h34v40h-34z"/>
                    <path stroke="#9d6339" opacity=".4" stroke-width="10" d="m460 800-105 200m785-195 95 195"/>
                </svg>
                <canvas id="room-scene" aria-hidden="true"></canvas>
                <p class="room-scene-label" aria-hidden="true">SHORE / 01</p>
            </div>
            <div class="room-dock">
                <div class="room-track"><span data-room-track>Martin Solli — Sage Counsel</span><span data-room-time>0:00</span></div>
                <input class="room-seek" type="range" min="0" max="1" value="0" step="0.1" aria-label="Playback position" data-room-seek disabled>
                <div class="room-controls">
                    <button type="button" class="room-button room-transport" data-room-play aria-label="Play music" aria-pressed="false"><svg data-room-pause viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg><svg data-room-start viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3 13 8 5 13Z"/></svg><span data-room-play-label>PLAY</span></button>
                    <button type="button" class="room-button room-motion" data-room-motion aria-pressed="true">MOTION ON</button>
                    <button type="button" class="room-button room-fullscreen" data-room-fullscreen aria-label="Enter fullscreen" aria-pressed="false">FULLSCREEN</button>
                </div>
            </div>
            <div class="room-playlist" aria-labelledby="room-playlist-title">
                <h2 id="room-playlist-title">SELECT A TRACK</h2>
                <ol>
                    <li><button type="button" data-room-song="sage-counsel" data-src="/audio/sage-counsel.mp3" data-title="Sage Counsel" data-artist="Martin Solli" data-scene="shore" aria-pressed="true"><span class="room-song-number">01</span><span><strong>Sage Counsel</strong><small>Martin Solli</small></span><span class="room-song-scene">DAY / SHORE</span></button></li>
                    <li><button type="button" data-room-song="dream-scenario" data-src="/audio/dream-scenario.mp3" data-title="Dream Scenario" data-artist="Martin Solli" data-scene="city" aria-pressed="false" disabled><span class="room-song-number">02</span><span><strong>Dream Scenario</strong><small>Martin Solli</small></span><span class="room-song-scene">AUDIO TO FOLLOW</span></button></li>
                </ol>
            </div>
            <audio data-room-audio preload="none"></audio>
        </section>
        <p class="room-note" data-room-still>This is a still preview. Enable JavaScript for motion and playback.</p>
        <p class="room-status" data-room-status role="status"></p>
    </main>
    <footer class="legal-footer"><p class="copyright-line"><span class="copyright-symbol">©</span> 2026 SECOND SOURCE AUDIO. ALL RIGHTS RESERVED.</p></footer>
</body>
</html>
